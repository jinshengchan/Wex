name: Auto Build

on:
  push:
    branches:
      - master
      - dev
    tags:
      - 'v*'
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '.editorconfig'
      - '.gitignore'
      - '.idea/**'
      - 'docs/**'

  pull_request:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '.editorconfig'
      - '.gitignore'
      - '.idea/**'
      - 'docs/**'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wex-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Calculate version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME}"
          else
            MAX=$(git tag -l "v[0-9]*" \
              | sed 's/^v//' \
              | grep -E '^[0-9]+$' \
              | sort -n \
              | tail -n1)

            if [ -z "$MAX" ]; then
              NEXT=226
            else
              NEXT=$((MAX + 1))
            fi

            VER="v${NEXT}"
          fi

          echo "VER=${VER}" >> "$GITHUB_ENV"
          echo "Build version: ${VER}"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Prepare Gradle for GitHub Actions
        shell: bash
        run: |
          # 删除仅适用于本机的代理和 Java 路径。
          # 这里只修改 GitHub Actions 临时环境，不修改仓库文件。
          sed -i \
            -e '/^systemProp\.http\.proxyHost=/d' \
            -e '/^systemProp\.http\.proxyPort=/d' \
            -e '/^systemProp\.https\.proxyHost=/d' \
            -e '/^systemProp\.https\.proxyPort=/d' \
            -e '/^org\.gradle\.java\.installations\.paths=/d' \
            gradle.properties

          echo "CI gradle.properties:"
          cat gradle.properties

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-37" \
            "ndk;30.0.14904198"

          echo "Installed NDK:"
          ls -la "${ANDROID_HOME}/ndk" || true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: >-
            aarch64-linux-android,
            x86_64-linux-android,
            armv7-linux-androideabi,
            i686-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: . -> target

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/configuration-cache
          key: >-
            gradle-${{ runner.os }}-${{
            hashFiles(
              '**/*.gradle*',
              '**/gradle-wrapper.properties',
              '**/gradle.properties'
            )
            }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install system dependencies
        shell: bash
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y gcc-multilib

      - name: Build native library
        shell: bash
        run: |
          cargo xtask configure
          cargo xtask build --native-only

      - name: Prepare keystore
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          KS_FILE="$RUNNER_TEMP/wekit-keystore.jks"
          CRED_FILE="$RUNNER_TEMP/keystore-creds.env"

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::group::Decode project keystore"

            echo "${{ secrets.KEYSTORE_BASE64 }}" \
              | base64 -d > "$KS_FILE"

            KS_SIZE=$(stat -c%s "$KS_FILE" 2>/dev/null || echo 0)

            if [ "$KS_SIZE" -lt 100 ]; then
              echo "::error::Decoded keystore is too small"
              exit 1
            fi

            KS_LOADED=false

            for STORE_TYPE in PKCS12 JKS; do
              if keytool -list \
                -keystore "$KS_FILE" \
                -storetype "$STORE_TYPE" \
                -storepass "${{ secrets.STORE_PASSWORD }}" \
                -alias "${{ secrets.KEY_ALIAS }}" \
                >/dev/null 2>&1; then

                KS_LOADED=true
                break
              fi
            done

            if [ "$KS_LOADED" = true ]; then
              echo "KS_PASS=${{ secrets.STORE_PASSWORD }}" \
                > "$CRED_FILE"

              echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" \
                >> "$CRED_FILE"

              echo "KEY_PASS=${{ secrets.KEY_PASSWORD }}" \
                >> "$CRED_FILE"

              echo "Using project keystore."
              echo "::endgroup::"
              exit 0
            fi

            echo "::warning::Project keystore failed."
            echo "::warning::Using temporary CI keystore."
            echo "::endgroup::"
          fi

          echo "::group::Generate temporary keystore"

          KS_PASS="wcx-store-pass"
          KEY_ALIAS="wcx"
          KEY_PASS="wcx-store-pass"

          rm -f "$KS_FILE"

          keytool -genkeypair -v \
            -keystore "$KS_FILE" \
            -storetype PKCS12 \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KS_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=WCX CI, OU=CI, O=WCX, L=CI, S=CI, C=CN"

          echo "KS_PASS=$KS_PASS" > "$CRED_FILE"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$CRED_FILE"
          echo "KEY_PASS=$KEY_PASS" >> "$CRED_FILE"

          echo "::endgroup::"

      - name: Build Release APK
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEKIT_KEYSTORE_FILE: >-
            ${{ runner.temp }}/wekit-keystore.jks
        run: |
          source "$RUNNER_TEMP/keystore-creds.env"

          export WEKIT_KEYSTORE_PASSWORD="$KS_PASS"
          export WEKIT_KEY_ALIAS="$KEY_ALIAS"
          export WEKIT_KEY_PASSWORD="$KEY_PASS"

          ./gradlew assembleRelease \
            --warning-mode all \
            --stacktrace

      - name: Build Pull Request APK
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew assembleRelease \
            --warning-mode all \
            --stacktrace

      - name: Collect APKs
        shell: bash
        run: |
          mkdir -p dist/apk

          find app/build/outputs/apk \
            -type f \
            -name '*.apk' \
            -exec cp -v {} dist/apk/ \;

          echo "Collected APKs:"
          ls -lh dist/apk

      - name: Collect mappings
        if: always()
        shell: bash
        run: |
          mkdir -p dist/mapping

          find app/build/outputs/mapping \
            -type f \
            -name 'mapping.txt' \
            -print0 2>/dev/null |
          while IFS= read -r -d '' file; do
            variant=$(basename "$(dirname "$file")")

            cp -v "$file" \
              "dist/mapping/mapping-${variant}.txt"
          done

          ls -lh dist/mapping || true

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: wcx-apk-${{ env.VER }}
          path: dist/apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload obfuscation mapping
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wcx-mapping-${{ env.VER }}
          path: dist/mapping/*.txt
          if-no-files-found: ignore
          retention-days: 30


  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    if: ${{ success() && github.ref == 'refs/heads/master' }}

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Calculate release version
        id: version
        shell: bash
        run: |
          GIT_HASH=$(git rev-parse --short HEAD)

          MAX=$(git tag -l "v[0-9]*" \
            | sed 's/^v//' \
            | grep -E '^[0-9]+$' \
            | sort -n \
            | tail -n1)

          if [ -z "$MAX" ]; then
            NEXT=226
          else
            NEXT=$((MAX + 1))
          fi

          VERSION_TAG="v${NEXT}"

          echo "tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "hash=${GIT_HASH}" >> "$GITHUB_OUTPUT"
          echo "count=${NEXT}" >> "$GITHUB_OUTPUT"

      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          pattern: wcx-apk-*
          path: artifacts
          merge-multiple: true

      - name: Generate update.json
        shell: bash
        run: |
          cat > artifacts/update.json <<EOF
          {
            "versionCode": ${{ steps.version.outputs.count }},
            "versionName": "${{ steps.version.outputs.tag }}",
            "commit": "${{ steps.version.outputs.hash }}"
          }
          EOF

          cat artifacts/update.json

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          PREV_TAG=$(
            git describe \
              --tags \
              --abbrev=0 \
              HEAD~1 \
              2>/dev/null || true
          )

          if [ -z "$PREV_TAG" ]; then
            CHANGELOG="首次发布"
          else
            COMMITS=$(
              git log \
                "${PREV_TAG}..HEAD" \
                --pretty=format:"- %s" \
                || true
            )

            FEATURES=""
            FIXES=""
            REMOVED=""
            OTHER=""

            while IFS= read -r line; do
              [ -z "$line" ] && continue

              msg=$(echo "$line" | sed 's/^- //')

              if echo "$msg" \
                | grep -qiE "^(feat|新增|添加|增加|实现)"; then

                FEATURES="${FEATURES}- ${msg}"$'\n'

              elif echo "$msg" \
                | grep -qiE "^(fix|修复|bug|解决|修)"; then

                FIXES="${FIXES}- ${msg}"$'\n'

              elif echo "$msg" \
                | grep -qiE "^(remove|删除|移除|去掉)"; then

                REMOVED="${REMOVED}- ${msg}"$'\n'

              else
                OTHER="${OTHER}- ${msg}"$'\n'
              fi

            done <<< "$COMMITS"

            CHANGELOG=""

            if [ -n "$FEATURES" ]; then
              CHANGELOG="${CHANGELOG}### 🎉 新增功能"$'\n'
              CHANGELOG="${CHANGELOG}${FEATURES}"$'\n'
            fi

            if [ -n "$FIXES" ]; then
              CHANGELOG="${CHANGELOG}### 🐛 修复问题"$'\n'
              CHANGELOG="${CHANGELOG}${FIXES}"$'\n'
            fi

            if [ -n "$REMOVED" ]; then
              CHANGELOG="${CHANGELOG}### 🗑️ 移除功能"$'\n'
              CHANGELOG="${CHANGELOG}${REMOVED}"$'\n'
            fi

            if [ -n "$OTHER" ]; then
              CHANGELOG="${CHANGELOG}### 🔧 其他改进"$'\n'
              CHANGELOG="${CHANGELOG}${OTHER}"$'\n'
            fi

            if [ -z "$CHANGELOG" ]; then
              CHANGELOG="暂无详细更新记录"
            fi
          fi

          printf '%s\n' "$CHANGELOG" \
            > artifacts/CHANGELOG.md

          {
            echo "changelog<<EOF"
            printf '%s\n' "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: master

          name: >-
            WCX ${{ steps.version.outputs.tag }}

          body: |
            ## WCX ${{ steps.version.outputs.tag }}

            自动构建正式版本

            提交 SHA:
            `${{ steps.version.outputs.hash }}`

            ${{ steps.changelog.outputs.changelog }}

            ### 📦 下载

            在下方 Assets 下载对应架构 APK。

          files: |
            artifacts/*.apk
            artifacts/update.json
            artifacts/CHANGELOG.md

          prerelease: false
          make_latest: true

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
