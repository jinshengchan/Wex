name: Auto Build

on:
  push:
    branches:
      - master
      - dev
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - 'docs/**'

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wex-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # 1. 下载源码，并自动拉取 bsh / reflekt 子模块
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      # 2. 项目要求 JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. 给 Gradle Wrapper 执行权限
      - name: Grant Gradle permission
        run: chmod +x gradlew

      # 4. 删除只适合本地电脑使用的 Java 路径
      - name: Prepare Gradle for GitHub Actions
        shell: bash
        run: |
          sed -i \
            -e '/^org\.gradle\.java\.installations\.paths=/d' \
            gradle.properties

          echo "gradle.properties used by CI:"
          cat gradle.properties

      # 5. 安装项目要求的 Android SDK 37 和 NDK
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          echo "sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-37" \
            "ndk;30.0.14904198"

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo "Installed NDK:"
          ls -la "$ANDROID_HOME/ndk"

      # 6. Rust 环境
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: >-
            aarch64-linux-android,
            x86_64-linux-android,
            armv7-linux-androideabi,
            i686-linux-android

      # 7. Rust 缓存
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: . -> target

      # 8. 检查环境
      - name: Show build environment
        shell: bash
        run: |
          echo "===== Java ====="
          java -version

          echo "===== Rust ====="
          rustc --version
          cargo --version

          echo "===== Android ====="
          echo "ANDROID_HOME=$ANDROID_HOME"

          echo "===== Git ====="
          git --version

          echo "===== Submodules ====="
          git submodule status

      # 9. 配置 Rust Android NDK
      - name: Configure native build
        shell: bash
        run: |
          cargo xtask configure

      # 10. 编译 Rust Native
      - name: Build native libraries
        shell: bash
        run: |
          cargo xtask build --native-only

      # 11. 编译 Release APK
      #
      # 如果以后设置正式签名 Secrets，
      # build.gradle.kts 会自动优先使用正式签名。
      # 没设置时会回退到 debug signing。
      - name: Build Release APK
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew assembleRelease \
            --stacktrace \
            --warning-mode all

      # 12. 收集 APK
      - name: Collect APK files
        shell: bash
        run: |
          mkdir -p dist/apk

          find app/build/outputs/apk \
            -type f \
            -name '*.apk' \
            -exec cp -v {} dist/apk/ \;

          echo ""
          echo "===== Generated APKs ====="
          ls -lh dist/apk

          APK_COUNT=$(find dist/apk -type f -name '*.apk' | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::No APK was generated."
            exit 1
          fi

      # 13. mapping 有就保存，没有也不会失败
      - name: Collect mapping files
        shell: bash
        run: |
          mkdir -p dist/mapping

          if [ -d app/build/outputs/mapping ]; then
            find app/build/outputs/mapping \
              -type f \
              -name 'mapping.txt' \
              -exec cp -v {} dist/mapping/ \;
          fi

          echo "Mapping files:"
          ls -lh dist/mapping || true

      # 14. 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Wex-v247-build-${{ github.run_number }}
          path: dist/apk/*.apk
          if-no-files-found: error
          retention-days: 30

      # 15. 上传混淆 mapping
      - name: Upload mapping
        uses: actions/upload-artifact@v7
        with:
          name: Wex-mapping-build-${{ github.run_number }}
          path: dist/mapping/*.txt
          if-no-files-found: ignore
          retention-days: 30
