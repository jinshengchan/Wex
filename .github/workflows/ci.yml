name: Auto Build

on:
  push:
    branches:
      - master
      - dev
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - 'docs/**'

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wex-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.value }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Read APK version
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(grep -m1 -E '^[[:space:]]*versionName = "' app/build.gradle.kts | cut -d '"' -f2)
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::Could not read app versionName."
            exit 1
          fi
          echo "value=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "APK release version: $VERSION_NAME"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Prepare Gradle for GitHub Actions
        shell: bash
        run: |
          sed -i \
            -e '/^org\.gradle\.java\.installations\.paths=/d' \
            gradle.properties

          echo "===== gradle.properties ====="
          cat gradle.properties

      - name: Prepare Android SDK and NDK
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          echo "sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-37.0"

          "$SDKMANAGER" \
            "ndk;30.0.14904198"

          echo "===== Android platforms ====="
          ls -la "$ANDROID_HOME/platforms"

          echo "===== Android NDK ====="
          ls -la "$ANDROID_HOME/ndk"

          test -d "$ANDROID_HOME/platforms/android-37.0"
          test -d "$ANDROID_HOME/ndk/30.0.14904198"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: >-
            aarch64-linux-android,
            x86_64-linux-android,
            armv7-linux-androideabi,
            i686-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: . -> target

      - name: Show build environment
        shell: bash
        run: |
          echo "===== Java ====="
          java -version

          echo "===== Rust ====="
          rustc --version
          cargo --version

          echo "===== Android SDK ====="
          echo "ANDROID_HOME=$ANDROID_HOME"

          echo "===== NDK ====="
          ls -la "$ANDROID_HOME/ndk/30.0.14904198"

          echo "===== Submodules ====="
          git submodule status

      - name: Configure native build
        shell: bash
        run: |
          cargo run -p xtask -- configure

      - name: Build native libraries
        shell: bash
        run: |
          cargo run -p xtask -- build --native-only

      - name: Build Release APK
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew assembleRelease \
            -x :app:lintVitalLegacyRelease \
            -x :app:lintVitalStandardRelease \
            --stacktrace \
            --warning-mode all

      - name: Collect APK files
        shell: bash
        run: |
          mkdir -p dist/apk

          find app/build/outputs/apk \
            -type f \
            -name '*.apk' \
            -exec cp -v {} dist/apk/ \;

          echo "===== Generated APKs ====="
          ls -lh dist/apk

          APK_COUNT=$(find dist/apk -type f -name '*.apk' | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::No APK was generated."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Wex-${{ steps.version.outputs.value }}-build-${{ github.run_number }}
          path: dist/apk/*.apk
          if-no-files-found: error
          retention-days: 30
  release:
    name: Publish APK Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: Wex-${{ needs.build.outputs.version_name }}-build-${{ github.run_number }}
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.version_name }}-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "WCX ${{ needs.build.outputs.version_name }} Build #${{ github.run_number }}"
          body: |
            自动构建 APK。
            Commit: `${{ github.sha }}`
          files: release-assets/*.apk
          fail_on_unmatched_files: true
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
